name: Go prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Go prerelease version (for example 2.0.0rc1)"
        required: true
        default: "2.0.0rc1"
        type: string
      publish_release:
        description: "Use the maintainer signing key and create a reviewable draft prerelease"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: go-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/build-go.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      channel: rc
      official_signing: ${{ inputs.publish_release }}
  publish:
    if: inputs.publish_release
    needs: candidate
    permissions:
      contents: write
    uses: ./.github/workflows/publish-go.yml
    with:
      version: ${{ inputs.version }}
      prerelease: true
