name: Go release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Go stable version (for example 2.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: go-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/build-go.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      channel: stable
      official_signing: true
  publish:
    needs: candidate
    permissions:
      contents: write
    uses: ./.github/workflows/publish-go.yml
    with:
      version: ${{ inputs.version }}
      prerelease: false
