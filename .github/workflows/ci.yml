name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Documentation links and changed-path guidance
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python3 scripts/check_docs.py
          base=""
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; fi
          if [ "$EVENT_NAME" = push ]; then base="$PUSH_BEFORE"; fi
          if [[ "$base" =~ ^0+$ ]]; then base=""; fi
          if [ -z "$base" ] && [ "$EVENT_NAME" != push ]; then
            base=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            python3 scripts/doc_context.py --base "$base"
          else
            # New branches and unreachable force-push bases use all tracked paths.
            mapfile -d '' files < <(git ls-files -z)
            python3 scripts/doc_context.py --files "${files[@]}"
          fi
      - id: toolchain
        run: echo "version=$(python3 -c 'import json; print(json.load(open("targets.json"))["go_version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install host test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 make gcc
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/pip" install "ruff==0.16.5" "PyYAML==6.0.2"
      - name: Go format, vet, shuffled tests, coverage and race
        run: bash scripts/verify-go.sh
      - name: Host tooling and frozen LuCI contracts
        run: |
          "$RUNNER_TEMP/checks/bin/ruff" check scripts tests
          node --check root/www/luci-static/resources/smart_srun.js
          "$RUNNER_TEMP/checks/bin/python" -m unittest discover -s tests -v
      - name: Representative Linux architectures
        working-directory: core
        run: |
          for arch in amd64 arm64 arm mips mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM=7 GOMIPS=softfloat \
              go build -trimpath -o "$RUNNER_TEMP/srunnet-$arch" ./cmd/srunnet
          done
      - name: Source and privacy checks
        run: |
          python3 scripts/check_go_source.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mkdir "$RUNNER_TEMP/source-audit"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-audit"
          cd "$RUNNER_TEMP/source-audit"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --redact --no-banner
